name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag
        required: true
        type: string
      skip_tests:
        description: Skip tests
        required: false
        default: false
        type: boolean
      skip_db_backup:
        description: Skip database backup
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: af-south-1
  EKS_CLUSTER: lastmile-gig-production

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.checks.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - id: checks
        run: |
          # Check if this is a release commit
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Check version
        run: |
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Branch: ${{ github.ref }}"

  create-db-backup:
    name: Create Database Backup
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_db_backup
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create RDS snapshot
        run: |
          aws rds create-db-snapshot \
            --db-instance-identifier lastmile-production-db \
            --snapshot-identifier lastmile-prod-$(date +%Y%m%d-%H%M%S)

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks, create-db-backup]
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Update EKS config
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }}
      
      - name: Deploy applications
        run: |
          # Apply all manifests
          kubectl apply -f deploy/k8s/base/namespace.yaml
          kubectl apply -f deploy/k8s/base/services.yaml
          kubectl apply -f deploy/k8s/base/configmaps.yaml
          kubectl apply -f deploy/k8s/base/deployments.yaml
          
          # Wait for rollout
          for deployment in gateway orders drivers dispatch payments storefronts analytics ai notifications fleet; do
            kubectl rollout status deployment/${deployment}-deployment -n lastmile-gig --timeout=600s || exit 1
          done
      
      - name: Deploy Ingress
        run: kubectl apply -f deploy/k8s/base/ingress.yaml
      
      - name: Deploy HPA
        run: kubectl apply -f deploy/k8s/base/horizontal-pod-autoscalers.yaml

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
    steps:
      - name: Test health endpoints
        run: |
          curl -f https://api.lastmile-gig.com/health || exit 1
          curl -f https://api.lastmile-gig.com/orders/health || exit 1
          curl -f https://api.lastmile-gig.com/drivers/health || exit 1
          curl -f https://api.lastmile-gig.com/payments/health || exit 1
      
      - name: Test authentication
        run: |
          TOKEN=$(curl -s -X POST https://api.lastmile-gig.com/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"test"}' | jq -r .token)
          [ "$TOKEN" != "null" ]
      
      - name: Test order creation
        run: |
          curl -f -X POST https://api.lastmile-gig.com/orders \
            -H "Content-Type: application/json" \
            -d '{"partnerId":"test","items":[]}' || true

  cleanup Old Deployments:
    name: Cleanup Old Deployments
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Cleanup old pods
        run: |
          kubectl delete pod -n lastmile-gig -l 'cleanup=old' --grace-period=0 || true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [smoke-tests, cleanup Old Deployments]
    if: always()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}