name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: af-south-1
  EKS_CLUSTER: lastmile-gig-staging

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }}
          
          # Deploy namespace
          kubectl apply -f deploy/k8s/base/namespace.yaml
          
          # Deploy services
          kubectl apply -f deploy/k8s/base/services.yaml
          
          # Deploy ConfigMaps
          kubectl apply -f deploy/k8s/base/configmaps.yaml
          
          # Deploy applications
          kubectl apply -f deploy/k8s/base/deployments.yaml
          
          # Wait for rollout
          kubectl rollout status deployment/gateway-deployment -n lastmile-gig --timeout=300s
          kubectl rollout status deployment/orders-deployment -n lastmile-gig --timeout=300s
          kubectl rollout status deployment/drivers-deployment -n lastmile-gig --timeout=300s
          kubectl rollout status deployment/dispatch-deployment -n lastmile-gig --timeout=300s
          kubectl rollout status deployment/payments-deployment -n lastmile-gig --timeout=300s
      
      - name: Deploy Ingress
        run: kubectl apply -f deploy/k8s/base/ingress.yaml
      
      - name: Verify deployment
        run: |
          echo "Testing endpoints..."
          sleep 10
          
          curl -f https://staging-api.lastmile-gig.com/health || exit 1
          curl -f https://staging-api.lastmile-gig.com/orders/health || exit 1
          curl -f https://staging-api.lastmile-gig.com/drivers/health || exit 1
      
      - name: Run smoke tests
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        run: |
          npm run test:e2e -- --env BASE_URL=https://staging-api.lastmile-gig.com || true
      
      - name: Notify success
        if: always()
        run: echo "Deployment completed"

  backup-db-staging:
    name: Backup Staging Database
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - name: Create RDS snapshot
        run: |
          aws rds create-db-snapshot \
            --db-instance-identifier lastmile-staging-db \
            --snapshot-identifier lastmile-staging-$(date +%Y%m%d-%H%M%S)

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, backup-db-staging]
    if: always()
    steps:
      - name: Send notification
        run: echo "Deployment status: ${{ needs.deploy-staging.result }}"